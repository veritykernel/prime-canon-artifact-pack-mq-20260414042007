name: validate-prime-canon

permissions:
  contents: read

on:
  pull_request:
  push:
    paths:
      - "canon/**"
      - "control/**"
      - "receipts/**"
      - "replay/**"
      - "views/**"
      - "schemas/**"
      - "scripts/**"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve immutable receipt history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "$GITHUB_SHA^")"
          fi
          python scripts/check_immutable_history.py "$BASE_SHA" "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.18"
      - name: Install validator deps
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements.txt
      - name: Validate prime canon pack
        run: python scripts/validate_pack.py .
      - name: Test promotion gates
        run: python -m unittest discover -s scripts/tests -v
